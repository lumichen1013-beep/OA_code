<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
	<title>Document</title>
	<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 切換前台/後台的按鈕 -->
    <button id="toggleButton">後台/前台</button>
    
    <!--==================== 前台頁面 ====================-->
    <div id="frontend">
        <!-- 圖片 -->
        <img id="banner" src="banner.jpg"/>
        
        <!-- 問卷表單 -->
        <div id="form">
            <h1 id="">用餐滿意度調查</h1>
            <p>填寫本問卷即可以獲得抽獎機會，頭獎為頂級豪華郵輪雙人行！</p>
            
            <h3>用餐服務*</h3>
            <select id="service">
                <option value="5">非常滿意 (5分)</option>
                <option value="4">滿意 (4分)</option>
                <option value="3">普通 (3分)</option>
                <option value="2">不滿意 (2分)</option>
                <option value="1">非常不滿意 (1分)</option>
            </select>
            
            <h3>食物美味*</h3>
            <select id="meal">
                <option value="5">非常滿意 (5分)</option>
                <option value="4">滿意 (4分)</option>
                <option value="3">普通 (3分)</option>
                <option value="2">不滿意 (2分)</option>
                <option value="1">非常不滿意 (1分)</option>
            </select>
            
            <h3>餐點價格*</h3>
            <select id="price">
                <option value="5">非常滿意 (5分)</option>
                <option value="4">滿意 (4分)</option>
                <option value="3">普通 (3分)</option>
                <option value="2">不滿意 (2分)</option>
                <option value="1">非常不滿意 (1分)</option>
            </select>
            
            <h3>您是如何得知本店*</h3>
            <select id="source">
                <option value="親友介紹">親友介紹</option>
                <option value="網路資訊">網路資訊</option>
                <option value="廣告傳單">廣告傳單</option>
                <option value="其他">其他</option>
            </select>
            
            <h3>建議</h3>
            <textarea id="suggestion" rows="8" cols="40"></textarea>
            
            <h3>信箱*</h3>
            <input id="email"/>
            
            <h3>是否願意收到最新活動與優惠資訊*</h3>
            <input id="subscribe" type="checkbox"/>願意
            
            <button id="submit">送出表單</button>
        </div>
        
        <!-- 成功訊息 -->
        <div id="success">
            <h3>送出成功</h3>
            <p>感謝您的填寫，期待您再次光臨！</p>
            <p>系統將會自動抽出獎品並寄出中獎通知信</p>
            <button id="backToForm">再次填寫</button>
        </div>
    </div>
    
    <!--==================== 後台頁面 ====================-->
    <div id="backend">
        
        <div id="info">
            填寫人數：<span id="total">?</span> 人
            <br/>
            平均服務評價：<span id="serviceAvg">?</span>分
            <br/>
            平均食物評價：<span id="mealAvg">?</span>分
            <br/>
            平均價格評價：<span id="valueAvg">?</span>分
        </div>
        
        <table>
            <thead>
                <tr>
                   <th>服務</th>
                   <th>食物</th>
                   <th>價格</th>
                   <th>來源</th>
                   <th>建議</th>
                   <th>信箱</th> 
                   <th>訂閱</th> 
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>5</td>
                    <td>5</td>
                    <td>5</td>
                    <td>網路資訊</td>
                    <td>Great！</td>
                    <td>hi@gmail.com</td>
                    <td>true</td>
                </tr>
            </tbody>
        </table>
    </div>
    
<script src="script.js" charset="utf-8"></script>
</body>
</html>

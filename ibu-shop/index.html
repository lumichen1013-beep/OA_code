<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>伊布購物平台</title>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id='gohome'>home</button>
    <h1 id='money'>money:</h1>
    <button class='home' id='shop'>購物</button>
    <br>
    <button class='home' id='shopcar'>購物車</button>
    <br>
    <button class='home' id='work'>工作</button>
    <img class='home' id='none' style="float: right" src="https://i.pinimg.com/originals/a1/54/4f/a1544f4870f4a048301417809a193755.gif" alt="">
    <img id='red' style="float: right" src="https://i.pinimg.com/originals/e0/31/4f/e0314f09572be0eb5b4ac66753acfd9a.gif" alt="">
    <img id='blue' style="float: right" src="https://i.pinimg.com/originals/9c/93/87/9c9387ac2d46888d56e299b679cc8bfc.gif" alt="">
    <img id='green' style="float: right" src="https://i.pinimg.com/originals/d4/86/45/d48645e0ab49d1466c51518941cf4beb.gif" alt="">
    <img id='pocketmons' style="float: right" src="https://i.pinimg.com/originals/b0/a9/0b/b0a90b5978fa40fa31bff829dcd62667.gif" alt="">
    <img id='seed' style="float: right" src="https://media.tenor.com/Xk_vvJfUA60AAAAj/pokemon-%E5%AF%B6%E5%8F%AF%E5%A4%A2.gif" alt="">
    <p class='hello' id='hello_word'>
        歡迎來到伊布購物平台
        <br>
        我是伊布，是一隻自由自在的伊布
    </p>
    <button class='hello' id='hello1' onclick="hello()">next</button>
    <button class='hello' id='hello2' onclick="hello2()">next</button>
    <button class='hello' id='hello3' onclick="hello3()">next</button>

    <h1 class='landing'>landing</h1>

    <div class="shoping">
        <div id="a">
            <img id='pen' class='things' src='https://upload.wikimedia.org/wikipedia/commons/0/08/Pencils_hb.jpg'>
            <h1>鉛筆 $20 (原價$30)</h1>
        </div>
        <div id="b">
            <img class='things' src='https://media.tenor.com/Xk_vvJfUA60AAAAj/pokemon-%E5%AF%B6%E5%8F%AF%E5%A4%A2.gif'>
            <h1>妙蛙種子 $150 (原價$250)</h1>
        </div>
        <div id="c">
            <img class='things' src='https://i.pinimg.com/originals/b0/a9/0b/b0a90b5978fa40fa31bff829dcd62667.gif'>
            <h1>寶可夢們 $200 (原價$300)</h1>
        </div>
        <div id="d">
            <img class='things' src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR57m5oFzTuMRNAXPUGyCdrpq0Ysh-ljleCDg&s'>
            <h1>工作+1 $20 (原價$30)</h1>
        </div>
        <div id="e">
            <img class='things' src='https://agirls.aottercdn.com/media/65c8646f-a003-4360-9870-63b4a101cea5.jpg'>
            <h1>好看的背景(水) $200 (原價$300)</h1>
        </div>
        <div id="f">
            <img class='things' src='https://static.popdaily.com.tw/wp-content/uploads/2023/07/69ottv8qo8gsgwcg4o040c8kgrxf2o6-1000x563.jpg'>
            <h1>好看的背景(光) $200 (原價$300)</h1>
        </div>
        <div id="g">
            <img class='things' src='https://i.pinimg.com/originals/e0/31/4f/e0314f09572be0eb5b4ac66753acfd9a.gif'>
            <h1>火伊布 $100 (原價$200)</h1>
        </div>
        <div id="h">
            <img class='things' src='https://i.pinimg.com/originals/9c/93/87/9c9387ac2d46888d56e299b679cc8bfc.gif'>
            <h1>水伊布 $100 (原價$200)</h1>
        </div>
        <div id="i">
            <img class='things' src='https://i.pinimg.com/originals/d4/86/45/d48645e0ab49d1466c51518941cf4beb.gif'>
            <h1>葉伊布 $100 (原價$200)</h1>
        </div>
    </div>

    <div class='shopcar' id='list'></div>
    <button class='shopcar' id='buy_btn'>送出</button>

    <button class='worker'>工作!</button>

<script src="script.js" charset="utf-8"></script>
</body>
</html>

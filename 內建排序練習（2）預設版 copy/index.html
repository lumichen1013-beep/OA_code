<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>購物商品</h1>
    <div class="btn-group">
        <button onclick="order_by_price_asc()">價格由低到高</button>
        <button onclick="order_by_price_desc()">價格由高到低</button>
        <button onclick="order_by_like_asc()">評價由低到高</button>
        <button onclick="order_by_like_desc()">評價由高到低</button>    
    </div>
    
    <table id="root">
        <tr>
            <th>商品名稱</th>
            <th onclick="orderByPrice()">價格</th>
            <th onclick="orderByLike()">評價</th>
        </tr>
        <tr v-for="d in data">
            <td>{{d.name}}</td>
            <td>$ {{d.price}}</td>
            <td>&#11088;{{d.like}}</td>
        </tr>
    </table>
<script src="script.js" charset="utf-8"></script>
</body>
</html>
